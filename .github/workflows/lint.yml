name: Lint Ren'Py

# Vérifie le script et le build web à chaque pull request, avant la fusion
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Ren'Py avec le support Web
        uses: remarkablegames/setup-renpy@v1
        with:
          web: true

      - name: Vérifier le script (Lint)
        run: |
          renpy-cli game lint | tee lint.txt
          # Le lint signale les erreurs sans toujours échouer : on vérifie nous-mêmes
          if grep -qiE "^game/.*(error|erreur)|is not a known|could not be found|Traceback" lint.txt; then
            echo "::error::Le lint a trouvé des erreurs"
            exit 1
          fi

      - name: Compiler le projet pour le Web (sans le publier)
        run: |
          renpy-launcher web_build . --destination ./web_build
          echo "=== Taille du build web ==="
          du -sh ./web_build
          ls -la ./web_build
