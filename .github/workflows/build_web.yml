name: Build Ren'Py Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compiler le projet pour le Web avec Ren'Py
        uses: ProjectAlice/renpy-action@v1
        with:
          renpy-version: "8.5.3"
          build-web: true

      - name: Uploader l'artefact pour GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web_build"

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4