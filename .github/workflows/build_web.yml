name: Build Ren'Py Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compiler le projet avec Ren'Py (Docker)
        run: |
          docker run --rm -v "$PWD":/project renpy/renpy:8.2.3 \
            /renpy/renpy.sh /renpy/launcher distribute /project --destination /project/web_build --package web

      - name: Uploader l'artefact pour GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web_build"

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4