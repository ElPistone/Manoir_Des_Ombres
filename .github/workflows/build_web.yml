name: Build Ren'Py Web

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Installer Ren'Py avec le support Web
        uses: remarkablegames/setup-renpy@v1
        with:
          web: true

      - name: Vérifier le script (Lint)
        run: |
          renpy-cli game lint

      - name: Compiler le projet pour le Web
        run: renpy-launcher web_build . --destination ./web_build

      - name: Vérifier le contenu du build
        run: |
          echo "=== Contenu de web_build ==="
          ls -la ./web_build || echo "Dossier web_build introuvable !"

      - name: Uploader l'artefact pour GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./web_build"

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4